workflows:
  e2008-android-debug-v5:
    name: e-2008 CAN - Build APK v23 LIVE + DECODE + FULL BMS v23 ANDROID SOCKET FIX
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17
      vars:
        GRADLE_VERSION: "8.7"

    scripts:
      - name: V5 marker
        script: |
          set -e
          echo "===== E2008 CODEMAGIC V5 ACTIVE ====="
          echo "Commit: $CM_COMMIT"
          echo "Branch: $CM_BRANCH"

      - name: Unpack Android project
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          rm -rf project
          mkdir project
          unzip -q e2008-project.zip -d project
          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle
          echo "Android project unpacked OK"

      - name: Configure Android SDK
        script: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}"
          echo "SDK_ROOT=$SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > "$CM_BUILD_DIR/project/local.properties"

          echo "Installed Android platforms:"
          ls -1 "$SDK_ROOT/platforms" 2>/dev/null || true

          echo "Installed Android build-tools:"
          ls -1 "$SDK_ROOT/build-tools" 2>/dev/null || true

          if [ -d "$SDK_ROOT/platforms/android-35" ] && [ -d "$SDK_ROOT/build-tools/35.0.0" ]; then
            echo "Android API 35 and Build Tools 35.0.0 already installed."
            exit 0
          fi

          SDKMANAGER="/usr/local/share/android-sdk/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" /usr/local/share/android-sdk -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Install exact Gradle 8.7
        script: |
          set -e
          GRADLE_ZIP="/tmp/gradle-${GRADLE_VERSION}-bin.zip"
          GRADLE_HOME="/tmp/gradle-${GRADLE_VERSION}"

          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            curl --fail --location --retry 3               "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"               --output "$GRADLE_ZIP"
            rm -rf "$GRADLE_HOME"
            unzip -q "$GRADLE_ZIP" -d /tmp
          fi

          "$GRADLE_HOME/bin/gradle" --version

      - name: Build debug APK
        script: |
          set -e
          cd "$CM_BUILD_DIR/project"
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle             --no-daemon             --stacktrace             clean assembleDebug

      - name: Verify APK
        script: |
          set -e
          APK="$CM_BUILD_DIR/project/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          echo "APK ready: $APK"

    artifacts:
      - project/app/build/outputs/apk/debug/app-debug.apk
      - project/app/build/reports/**
